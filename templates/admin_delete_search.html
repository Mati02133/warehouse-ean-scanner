<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuń produkt</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 { font-size: 1.5rem; margin-bottom: 24px; }
        h3 { font-size: 1rem; margin-top: 24px; margin-bottom: 8px; }
        nav { margin-bottom: 20px; }
        nav a { color: #2563eb; text-decoration: none; margin-right: 16px; }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .search-wrapper { position: relative; margin-bottom: 16px; }
        #suggestions-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 10;
        }
        .suggestion-item {
            padding: 12px 14px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        .suggestion-item:hover { background-color: #f0f0f0; }
        .suggestion-item:last-child { border-bottom: none; }
        form.ean-form { display: flex; gap: 8px; }
        button {
            padding: 14px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            cursor: pointer;
        }
        .error-box {
            background-color: #fee2e2;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            color: #991b1b;
        }
        .success-box {
            background-color: #dcfce7;
            border: 1px solid #86efac;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            color: #166534;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/admin">← Panel</a>
        <a href="/logout">Wyloguj się</a>
    </nav>

    <h1>Znajdź produkt do usunięcia</h1>

    {% if request.args.get('success') %}
        <div class="success-box">Produkt usunięty.</div>
    {% endif %}

    <h3>Szukaj po nazwie</h3>
    <div class="search-wrapper">
        <input type="text" id="name-search-input" placeholder="Wpisz nazwę produktu..." autocomplete="off">
        <div id="suggestions-box"></div>
    </div>

    <h3>Szukaj po kodzie EAN</h3>
    <form class="ean-form" method="GET">
        <input type="text" name="ean" placeholder="Dokładny kod EAN">
        <button type="submit">Szukaj</button>
    </form>

    {% if error %}
        <div class="error-box">{{ error }}</div>
    {% endif %}

    <script>
        const nameInput = document.getElementById('name-search-input');
        const suggestionsBox = document.getElementById('suggestions-box');
        let debounceTimer = null;

        nameInput.addEventListener('input', () => {
            const query = nameInput.value.trim();
            clearTimeout(debounceTimer);

            if (query.length < 3) {
                suggestionsBox.innerHTML = '';
                return;
            }

            debounceTimer = setTimeout(() => {
                fetch(`/api/admin_search_name?q=${encodeURIComponent(query)}`)
                    .then(response => response.json())
                    .then(products => {
                        suggestionsBox.innerHTML = '';
                        products.forEach(product => {
                            const item = document.createElement('div');
                            item.className = 'suggestion-item';
                            item.textContent = `${product.name} — ${product.location}`;
                            item.addEventListener('click', () => {
                                window.location.href = `/admin/products/delete/${product.rowid}`;
                            });
                            suggestionsBox.appendChild(item);
                        });
                    });
            }, 300);
        });

        document.addEventListener('click', (e) => {
            if (!nameInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
                suggestionsBox.innerHTML = '';
            }
        });
    </script>
</body>
</html>
