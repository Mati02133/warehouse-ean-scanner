<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse EAN Scanner</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 24px;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            margin-bottom: 12px;
            cursor: pointer;
        }
        button:active {
            background-color: #1d4ed8;
        }
        #start-scan-btn {
            padding: 22px;
            font-size: 1.25rem;
            font-weight: 600;
            border-radius: 12px;
        }
        #start-scan-btn.scanning {
            background-color: #dc2626;
        }
        #name-search-input {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .search-wrapper {
            position: relative;
            margin-bottom: 16px;
        }
        #suggestions-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 10;
        }
        .suggestion-item {
            padding: 12px 14px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        .suggestion-item:hover {
            background-color: #f0f0f0;
        }
        .suggestion-item:last-child {
            border-bottom: none;
        }
        #scan-status {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 16px;
            min-height: 1.2em;
        }
        form {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        form button {
            width: auto;
            padding: 14px 20px;
            margin-bottom: 0;
        }
        .result-box {
            background-color: #dcfce7;
            border: 1px solid #86efac;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
        }
        .error-box {
            background-color: #fee2e2;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            color: #991b1b;
        }
    </style>
</head>
<body>
    {% if admin %}
    <div style="text-align: right; margin-bottom: 12px; font-size: 0.9rem;">
        Zalogowano jako <strong>{{ admin.username }}</strong> — <a href="/admin/sessions">sesje</a> · <a href="/logout">wyloguj</a>
    </div>
{% endif %}
    <h1>Wyszukaj produkt po EAN</h1>

    <div class="search-wrapper">
        <input type="text" id="name-search-input" placeholder="Szukaj po nazwie produktu..." autocomplete="off">
        <div id="suggestions-box"></div>
    </div>

    <button id="start-scan-btn">📷 Skanuj kod EAN</button>
    <div id="scan-status"></div>

    <form method="POST" id="ean-form">
        <input type="text" name="ean" id="ean-input" placeholder="Wpisz kod EAN" required>
        <button type="submit">Szukaj</button>
    </form>

    {% if result %}
        <div class="result-box">
            <p><strong>Nazwa:</strong> {{ result.name }}</p>
            <p><strong>Lokalizacja:</strong> {{ result.location }}/{{ result.ean_last3 }}</p>
        </div>
    {% endif %}

    {% if error %}
        <div class="error-box">{{ error }}</div>
    {% endif %}

<script type="module">
    import WebcamBarcodeScanner from 'https://cdn.jsdelivr.net/npm/@point-of-sale/webcam-barcode-scanner/dist/webcam-barcode-scanner.esm.js';

    const startBtn = document.getElementById('start-scan-btn');
    const scanStatus = document.getElementById('scan-status');
    const eanInput = document.getElementById('ean-input');
    const eanForm = document.getElementById('ean-form');

    let isConnected = false;
    let isProcessing = false;

    const scanner = new WebcamBarcodeScanner({
        allowedSymbologies: ['ean13', 'ean8'],
        preview: {
            size: 320,
            position: 'bottom-left',
            draggable: true,
            padding: { top: 100, left: 20, right: 20, bottom: 20 },
            radius: 10
        }
    });

    scanner.addEventListener('connected', () => {
        isConnected = true;
        startBtn.textContent = '⏹ Zatrzymaj skanowanie';
        startBtn.classList.add('scanning');
        scanStatus.textContent = 'Skieruj kamerę na kod EAN';

        setTimeout(async () => {
            const backCamera = scanner.devices.find(
                device => device.location === 'back' && !device.label.toLowerCase().includes('szerokokątny') && !device.label.toLowerCase().includes('ultra')
            );
            if (backCamera) {
                try {
                    await scanner.change(backCamera.deviceId);
                } catch (err) {
                    console.error('Błąd przełączania kamery:', err);
                }
            }
        }, 150);
    });

    scanner.addEventListener('disconnected', () => {
        isConnected = false;
        startBtn.textContent = '📷 Skanuj kod EAN';
        startBtn.classList.remove('scanning');
        scanStatus.textContent = '';
    });

    scanner.addEventListener('barcode', (e) => {
        if (isProcessing) return;
        isProcessing = true;

        scanStatus.textContent = 'Znaleziono: ' + e.value;
        scanner.disconnect();

        eanInput.value = e.value;
        setTimeout(() => {
            eanForm.submit();
        }, 200);
    });

    startBtn.addEventListener('click', () => {
        if (isConnected) {
            scanner.disconnect();
        } else {
            scanner.connect();
        }
    });

    // --- Wyszukiwanie po nazwie (bez zmian) ---
    const nameInput = document.getElementById('name-search-input');
    const suggestionsBox = document.getElementById('suggestions-box');
    let debounceTimer = null;

    nameInput.addEventListener('input', () => {
        const query = nameInput.value.trim();

        clearTimeout(debounceTimer);

        if (query.length < 3) {
            suggestionsBox.innerHTML = '';
            return;
        }

        debounceTimer = setTimeout(() => {
            fetch(`/api/search?q=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(products => {
                    suggestionsBox.innerHTML = '';
                    products.forEach(product => {
                        const item = document.createElement('div');
                        item.className = 'suggestion-item';
                        item.textContent = `${product.name} — ${product.location}/${product.ean_last3}`;
                        item.addEventListener('click', () => {
                            eanInput.value = product.ean;
                            suggestionsBox.innerHTML = '';
                            nameInput.value = '';
                            eanForm.submit();
                        });
                        suggestionsBox.appendChild(item);
                    });
                });
        }, 300);
    });

    document.addEventListener('click', (e) => {
        if (!nameInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
            suggestionsBox.innerHTML = '';
        }
    });
</script>
</body>
</html>
