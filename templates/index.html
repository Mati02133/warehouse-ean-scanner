<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse EAN Scanner</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 24px;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            margin-bottom: 12px;
            cursor: pointer;
        }

        button:active {
            background-color: #1d4ed8;
        }

        #qr-reader {
            margin-bottom: 16px;
            border-radius: 8px;
            overflow: hidden;
        }

        form {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        form button {
            width: auto;
            padding: 14px 20px;
            margin-bottom: 0;
        }

        .result-box {
            background-color: #dcfce7;
            border: 1px solid #86efac;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
        }

        .error-box {
            background-color: #fee2e2;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <h1>Wyszukaj produkt po EAN</h1>

    <button id="start-scan-btn">📷 Skanuj kod EAN</button>
    <div id="qr-reader" style="width: 100%; display: none;"></div>

    <form method="POST" id="ean-form">
        <input type="text" name="ean" id="ean-input" placeholder="Wpisz kod EAN" required>
        <button type="submit">Szukaj</button>
    </form>

    {% if result %}
        <div class="result-box">
            <p><strong>Nazwa:</strong> {{ result.name }}</p>
            <p><strong>Lokalizacja:</strong> {{ result.location }}</p>
        </div>
    {% endif %}

    {% if error %}
        <div class="error-box">{{ error }}</div>
    {% endif %}

    <script>
        const startBtn = document.getElementById('start-scan-btn');
        const readerDiv = document.getElementById('qr-reader');
        const eanInput = document.getElementById('ean-input');
        const eanForm = document.getElementById('ean-form');

        startBtn.addEventListener('click', () => {
            readerDiv.style.display = 'block';
            startBtn.style.display = 'none';

            const html5QrCode = new Html5Qrcode("qr-reader");

            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 250 },
                (decodedText) => {
                    html5QrCode.stop();
                    readerDiv.style.display = 'none';
                    eanInput.value = decodedText;
                    eanForm.submit();
                }
            );
        });
    </script>
</body>
</html>
