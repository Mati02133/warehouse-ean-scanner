<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dostęp do magazynu</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 24px;
        }

        h3 {
            font-size: 1rem;
            margin-top: 24px;
            margin-bottom: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            margin-bottom: 12px;
            cursor: pointer;
        }

        button:active {
            background-color: #1d4ed8;
        }

        #qr-reader {
            margin-bottom: 16px;
            border-radius: 8px;
            overflow: hidden;
        }

        form {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        form button {
            width: auto;
            padding: 14px 20px;
            margin-bottom: 0;
        }

        .error-box {
            background-color: #fee2e2;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <h1>Dostęp do magazynu</h1>

    <h3>Opcja 1: Wpisz kod dostępu</h3>
    <form method="POST">
        <input type="text" name="code" placeholder="Kod dostępu" required>
        <button type="submit">Wejdź</button>
    </form>

    {% if error %}
        <div class="error-box">{{ error }}</div>
    {% endif %}

    <h3>Opcja 2: Zeskanuj kod QR</h3>
    <button id="start-scan-btn">📷 Włącz skaner QR</button>
    <div id="qr-reader" style="width: 100%; display: none;"></div>

    <script>
        const startBtn = document.getElementById('start-scan-btn');
        const readerDiv = document.getElementById('qr-reader');

        startBtn.addEventListener('click', () => {
            readerDiv.style.display = 'block';
            startBtn.style.display = 'none';

            const html5QrCode = new Html5Qrcode("qr-reader");

            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 250 },
                (decodedText) => {
                    html5QrCode.stop();
                    window.location.href = decodedText;
                }
            );
        });
    </script>
<div style="text-align: center; margin-top: 24px;">
    <a href="/login" style="color: #2563eb;">Zaloguj się na konto</a>
</div>
</body>
</html>
