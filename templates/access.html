<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Dostęp do magazynu</title>
</head>
<body>
    <h1>Wpisz kod dostępu</h1>
    <form method="POST">
        <input type="text" name="code" placeholder="Kod dostępu" required>
        <button type="submit">Wejdź</button>
    </form>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
</body>
</html>
